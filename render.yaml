services:
  - type: web
    name: revorax-1
    runtime: python
    region: oregon
    plan: free
    # Builds the React app and copies it into backend/static so this single
    # service serves both the UI and the /api routes on one origin.
    buildCommand: bash build.sh
    # Seed first so the demo account has data, then run the API (+ static UI).
    startCommand: python backend/seed.py && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      # VITE_API_URL is deliberately ABSENT. It is baked in at build time and
      # must be empty so the browser calls /api on its own origin. Setting it
      # to http://localhost:8000 breaks every device.
    autoDeploy: true
