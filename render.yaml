services:
  - type: web
    name: revorax
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
    autoDeploy: true
