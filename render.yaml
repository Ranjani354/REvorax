services:
  - type: web
    name: revorax-1
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build && cp -r dist ../backend/static
    startCommand: cd backend && python -m main
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
